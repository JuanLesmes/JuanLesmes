name: 🐍 Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:     
  push:
    branches: [main] 

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente (claro y oscuro)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff7a18&color_dots=#fff1e0,#fed7aa,#fdba74,#fb923c,#ea580c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb347&color_dots=#161b22,#7c2d12,#c2410c,#f97316,#fdba74
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
