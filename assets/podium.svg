<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Podium: 1. Legal case manager (Alianza Jurídica) · 2. POS system for small businesses · 3. RecetarioVEG</title>
  <defs>
    <linearGradient id="bGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe38f"/><stop offset="1" stop-color="#e8ab06"/></linearGradient>
    <linearGradient id="bSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#b7c0cc"/></linearGradient>
    <linearGradient id="bBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dd9a66"/><stop offset="1" stop-color="#9a5527"/></linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="#ffcf40"/><stop offset="1" stop-color="#e08900"/></radialGradient>
    <radialGradient id="silver" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#d7dde6"/><stop offset="1" stop-color="#8e9bb0"/></radialGradient>
    <radialGradient id="bronze" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffe2c2"/><stop offset="0.5" stop-color="#d48a4a"/><stop offset="1" stop-color="#7a4520"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd86b" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
    <clipPath id="clipGold"><circle r="36"/></clipPath>
  </defs>

  <line x1="30" y1="411" x2="870" y2="411" stroke="#8b949e" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- 1 · oro -->
  <rect x="320" y="192" width="260" height="219" rx="14" fill="url(#bGold)" stroke="#c99400" stroke-width="1.5"/>
  <rect x="334" y="192" width="232" height="7" rx="3.5" fill="#ffffff" opacity="0.4"/>
  <text x="450" y="216" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#4a2f00" opacity="0.8">WHY I'M PROUD</text>
  <text x="450" y="235" text-anchor="middle" font-size="12.5" fill="#4a2f00">Rebuilt from scratch, with full</text>
  <text x="450" y="253" text-anchor="middle" font-size="12.5" fill="#4a2f00">ownership through production.</text>
  <text x="450" y="271" text-anchor="middle" font-size="12.5" fill="#4a2f00">Integrates the judicial-branch API</text>
  <text x="450" y="289" text-anchor="middle" font-size="12.5" fill="#4a2f00">and replaced manual, case-by-case</text>
  <text x="450" y="307" text-anchor="middle" font-size="12.5" fill="#4a2f00">lookups. 116 automated tests.</text>
  <text x="450" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#4a2f00" opacity="0.85">PYTHON · FASTAPI · SQLITE · DOCKER</text>
  <rect x="322.0" y="136" width="256" height="48" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/><text x="450" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">Legal case manager</text><text x="450" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e" opacity="0.85">Alianza Jurídica · Rama Judicial API</text>

  <!-- 2 · plata -->
  <rect x="50" y="262" width="250" height="149" rx="14" fill="url(#bSilver)" stroke="#93a0b0" stroke-width="1.5"/>
  <rect x="64" y="262" width="222" height="7" rx="3.5" fill="#ffffff" opacity="0.4"/>
  <text x="175" y="286" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2b3542" opacity="0.8">WHY I'M PROUD</text>
  <text x="175" y="305" text-anchor="middle" font-size="12.5" fill="#2b3542">Offline-first point of sale with</text>
  <text x="175" y="323" text-anchor="middle" font-size="12.5" fill="#2b3542">idempotent sync: the register</text>
  <text x="175" y="341" text-anchor="middle" font-size="12.5" fill="#2b3542">keeps selling even when the</text>
  <text x="175" y="359" text-anchor="middle" font-size="12.5" fill="#2b3542">internet goes down.</text>
  <text x="175" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#2b3542" opacity="0.85">TYPESCRIPT · POSTGRESQL · PWA</text>
  <rect x="60.0" y="206" width="230" height="48" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/><text x="175" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">POS system</text><text x="175" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e" opacity="0.85">for small businesses</text>

  <!-- 3 · bronce -->
  <rect x="600" y="280" width="250" height="131" rx="14" fill="url(#bBronze)" stroke="#7d4520" stroke-width="1.5"/>
  <rect x="614" y="280" width="222" height="7" rx="3.5" fill="#ffffff" opacity="0.4"/>
  <text x="725" y="304" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#fff6ec" opacity="0.8">WHY I'M PROUD</text>
  <text x="725" y="323" text-anchor="middle" font-size="12.5" fill="#fff6ec">121 recipes for Colombia with a</text>
  <text x="725" y="341" text-anchor="middle" font-size="12.5" fill="#fff6ec">search by what's in your fridge</text>
  <text x="725" y="359" text-anchor="middle" font-size="12.5" fill="#fff6ec">and a weekly meal planner.</text>
  <text x="725" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#fff6ec" opacity="0.85">TYPESCRIPT</text>
  <rect x="610.0" y="224" width="230" height="48" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/><text x="725" y="244" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">RecetarioVEG</text><text x="725" y="262" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e" opacity="0.85">vegan &amp; vegetarian recipes</text>

  <!-- medalla de oro (animada) -->
  <g transform="translate(450,92)">
    <circle r="50" fill="url(#glow)"><animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
    <path transform="translate(-58,-30) scale(1.1)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0s" repeatCount="indefinite"/></path><path transform="translate(56,-44) scale(0.9)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.6s" repeatCount="indefinite"/></path><path transform="translate(62,20) scale(1.2)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="1.1s" repeatCount="indefinite"/></path><path transform="translate(-52,28) scale(0.8)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/></path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <polygon points="-30,-84 -11,-84 8,-30 -12,-30" fill="#0ea5e9"/>
      <polygon points="30,-84 11,-84 -8,-30 12,-30" fill="#0f766e"/>
      <circle r="36" fill="url(#gold)" stroke="#b45309" stroke-width="2.5"/>
      <circle r="27" fill="none" stroke="#fff7d6" stroke-opacity="0.75" stroke-width="2"/>
      <text y="11" text-anchor="middle" font-size="30" font-weight="800" fill="#7a3d00">1</text>
      <g clip-path="url(#clipGold)">
        <rect x="-9" y="-46" width="18" height="92" fill="#ffffff" opacity="0.6" transform="skewX(-22)">
          <animateTransform attributeName="transform" type="translate" values="-80 0;90 0;90 0" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite" additive="sum"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- medalla de plata -->
  <g transform="translate(175,170)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.4s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <polygon points="-24,-66 -9,-66 6,-24 -10,-24" fill="#0ea5e9"/><polygon points="24,-66 9,-66 -6,-24 10,-24" fill="#0f766e"/>
    <circle r="28" fill="url(#silver)" stroke="#6b7a90" stroke-width="2.5"/><circle r="20" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#3b4656">2</text>
  </g></g>

  <!-- medalla de bronce -->
  <g transform="translate(725,192)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.8s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <polygon points="-21,-58 -8,-58 5,-20 -9,-20" fill="#0ea5e9"/><polygon points="21,-58 8,-58 -5,-20 9,-20" fill="#0f766e"/>
    <circle r="24" fill="url(#bronze)" stroke="#6b3a12" stroke-width="2.5"/><circle r="17" fill="none" stroke="#ffe9d6" stroke-opacity="0.7" stroke-width="2"/>
    <text y="8" text-anchor="middle" font-size="21" font-weight="800" fill="#4a2508">3</text>
  </g></g>
</svg>
