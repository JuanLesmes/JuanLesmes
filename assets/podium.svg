<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Podio: 1. Administrador de procesos jurídicos (Alianza Jurídica) · 2. Sistema POS + ERP para negocios MIPYME · 3. RecetarioVEG</title>
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6ecff"/><stop offset="1" stop-color="#9ccfff"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9cf0"/><stop offset="1" stop-color="#2f7bd6"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1f4d"/></linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="#ffcf40"/><stop offset="1" stop-color="#e08900"/></radialGradient>
    <radialGradient id="silver" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#d7dde6"/><stop offset="1" stop-color="#8e9bb0"/></radialGradient>
    <radialGradient id="bronze" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffe2c2"/><stop offset="0.5" stop-color="#d48a4a"/><stop offset="1" stop-color="#7a4520"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd86b" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
    <clipPath id="clipGold"><circle r="36"/></clipPath>
  </defs>

  <!-- floor -->
  <line x1="30" y1="411" x2="870" y2="411" stroke="#8b949e" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== 1 · azul claro ===== -->
  <rect x="320" y="192" width="260" height="219" rx="14" fill="url(#b1)" stroke="#7cbcf5" stroke-width="1.5"/>
  <rect x="334" y="192" width="232" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
  <text x="450" y="216" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#0b2a4a" opacity="0.75">POR QUÉ ESTOY ORGULLOSO</text>
  <text x="450" y="235" text-anchor="middle" font-size="12.5" fill="#0b2a4a">Rediseñado desde cero, con</text>
  <text x="450" y="253" text-anchor="middle" font-size="12.5" fill="#0b2a4a">ownership completo a producción.</text>
  <text x="450" y="271" text-anchor="middle" font-size="12.5" fill="#0b2a4a">Integra la API de la Rama Judicial</text>
  <text x="450" y="289" text-anchor="middle" font-size="12.5" fill="#0b2a4a">y reemplazó la consulta manual</text>
  <text x="450" y="307" text-anchor="middle" font-size="12.5" fill="#0b2a4a">expediente por expediente.</text>
  <text x="450" y="325" text-anchor="middle" font-size="12.5" fill="#0b2a4a">116 pruebas automatizadas.</text>
  <text x="450" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#0b2a4a" opacity="0.8">PYTHON · FASTAPI · SQLITE · DOCKER</text>
  <rect x="330.0" y="136" width="240" height="48" rx="12" fill="#ffffff" stroke="#7cbcf5" stroke-width="1.5"/><text x="450" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Administrador de</text><text x="450" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8" opacity="0.85">procesos jurídicos · Alianza Jurídica</text>

  <!-- ===== 2 · azul medio ===== -->
  <rect x="50" y="262" width="250" height="149" rx="14" fill="url(#b2)" stroke="#2b6cc0" stroke-width="1.5"/>
  <rect x="64" y="262" width="222" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
  <text x="175" y="286" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ffffff" opacity="0.75">POR QUÉ ESTOY ORGULLOSO</text>
  <text x="175" y="305" text-anchor="middle" font-size="12.5" fill="#ffffff">Monolito modular, ledger inmutable</text>
  <text x="175" y="323" text-anchor="middle" font-size="12.5" fill="#ffffff">e idempotencia en cada operación.</text>
  <text x="175" y="341" text-anchor="middle" font-size="12.5" fill="#ffffff">La caja sigue vendiendo aunque</text>
  <text x="175" y="359" text-anchor="middle" font-size="12.5" fill="#ffffff">se caiga el internet.</text>
  <text x="175" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#ffffff" opacity="0.8">TYPESCRIPT · POSTGRESQL · PWA</text>
  <rect x="60.0" y="206" width="230" height="48" rx="12" fill="#ffffff" stroke="#2b6cc0" stroke-width="1.5"/><text x="175" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Sistema POS + ERP</text><text x="175" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8" opacity="0.85">para negocios MIPYME</text>

  <!-- ===== 3 · azul oscuro ===== -->
  <rect x="600" y="280" width="250" height="131" rx="14" fill="url(#b3)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="614" y="280" width="222" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
  <text x="725" y="304" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ffffff" opacity="0.75">POR QUÉ ESTOY ORGULLOSO</text>
  <text x="725" y="323" text-anchor="middle" font-size="12.5" fill="#ffffff">121 recetas para Colombia con</text>
  <text x="725" y="341" text-anchor="middle" font-size="12.5" fill="#ffffff">buscador por lo que hay en la</text>
  <text x="725" y="359" text-anchor="middle" font-size="12.5" fill="#ffffff">nevera y planificador semanal.</text>
  <text x="725" y="394" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#ffffff" opacity="0.8">TYPESCRIPT</text>
  <rect x="610.0" y="224" width="230" height="48" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="725" y="244" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">RecetarioVEG</text><text x="725" y="262" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8" opacity="0.85">recetario vegetariano y vegano</text>

  <!-- ===== Gold medal (animated) ===== -->
  <g transform="translate(450,92)">
    <circle r="50" fill="url(#glow)">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path transform="translate(-58,-30) scale(1.1)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0s" repeatCount="indefinite"/></path>
    <path transform="translate(56,-44) scale(0.9)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.6s" repeatCount="indefinite"/></path>
    <path transform="translate(62,20) scale(1.2)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="1.1s" repeatCount="indefinite"/></path>
    <path transform="translate(-52,28) scale(0.8)" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#ffd86b"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/></path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <polygon points="-30,-84 -11,-84 8,-30 -12,-30" fill="#ff3d77"/>
      <polygon points="30,-84 11,-84 -8,-30 12,-30" fill="#7b2ff7"/>
      <circle r="36" fill="url(#gold)" stroke="#b45309" stroke-width="2.5"/>
      <circle r="27" fill="none" stroke="#fff7d6" stroke-opacity="0.75" stroke-width="2"/>
      <text y="11" text-anchor="middle" font-size="30" font-weight="800" fill="#7a3d00">1</text>
      <g clip-path="url(#clipGold)">
        <rect x="-9" y="-46" width="18" height="92" fill="#ffffff" opacity="0.6" transform="skewX(-22)">
          <animateTransform attributeName="transform" type="translate" values="-80 0;90 0;90 0" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite" additive="sum"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- ===== Silver medal ===== -->
  <g transform="translate(175,170)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.4s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <polygon points="-24,-66 -9,-66 6,-24 -10,-24" fill="#ff3d77"/>
      <polygon points="24,-66 9,-66 -6,-24 10,-24" fill="#7b2ff7"/>
      <circle r="28" fill="url(#silver)" stroke="#6b7a90" stroke-width="2.5"/>
      <circle r="20" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
      <text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#3b4656">2</text>
    </g>
  </g>

  <!-- ===== Bronze medal ===== -->
  <g transform="translate(725,192)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.8s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <polygon points="-21,-58 -8,-58 5,-20 -9,-20" fill="#ff3d77"/>
      <polygon points="21,-58 8,-58 -5,-20 9,-20" fill="#7b2ff7"/>
      <circle r="24" fill="url(#bronze)" stroke="#6b3a12" stroke-width="2.5"/>
      <circle r="17" fill="none" stroke="#ffe9d6" stroke-opacity="0.7" stroke-width="2"/>
      <text y="8" text-anchor="middle" font-size="21" font-weight="800" fill="#4a2508">3</text>
    </g>
  </g>
</svg>
